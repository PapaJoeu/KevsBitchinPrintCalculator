<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kev's Bitchin' Print Calculator</title>
  <meta name="description" content="Print production calculator: imposition, guillotine program sequence, and score positions. Windows 98 style, built for phones.">
  <meta name="theme-color" content="#000080">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/win98.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="window">
    <header class="title-bar">
      <h1>Kev's Bitchin' Print Calculator</h1>
      <div class="controls" aria-hidden="true">
        <button type="button" tabindex="-1">_</button>
        <button type="button" tabindex="-1">□</button>
        <button type="button" tabindex="-1">×</button>
      </div>
    </header>

    <div id="tabs"></div>

    <section id="panel-calculator" role="tabpanel" aria-labelledby="tab-calculator">
      <main>
        <div class="column">
          <fieldset class="group">
            <legend>Units</legend>
            <div class="chips" id="unitChips" role="group" aria-label="Units" style="--cols: 2">
              <button type="button" data-unit="in" aria-pressed="true">in</button>
              <button type="button" data-unit="mm" aria-pressed="false">mm</button>
            </div>
          </fieldset>

          <div id="sheetInputs"></div>
          <div id="docInputs"></div>
          <div id="gutterInputs"></div>
          <div id="advancedInputs"></div>
          <div id="foldInputs"></div>
        </div>

        <div class="column">
          <fieldset class="group">
            <legend>Layout</legend>
            <div id="summary" class="summary"></div>
          </fieldset>

          <fieldset class="group sheetView">
            <legend>Sheet</legend>
            <canvas id="canvas" aria-label="Sheet layout preview"></canvas>
            <div id="legend" class="legend" hidden>
              <span><i class="swatch"></i>Document edge</span>
              <span><i class="swatch score"></i>Score line</span>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>Program sequence</legend>
            <div id="sequence"></div>
          </fieldset>

          <fieldset class="group">
            <legend>Scores</legend>
            <div id="scores"></div>
          </fieldset>

          <div id="shareBar"></div>
        </div>
      </main>
    </section>

    <section id="panel-history" class="view" role="tabpanel" aria-labelledby="tab-history" hidden>
      <fieldset class="group">
        <legend>Recent jobs</legend>
        <div id="history"></div>
      </fieldset>
    </section>

    <section id="panel-preferences" class="view" role="tabpanel" aria-labelledby="tab-preferences" hidden>
      <div id="preferences" class="prefs"></div>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
